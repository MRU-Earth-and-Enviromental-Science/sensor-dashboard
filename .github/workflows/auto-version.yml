name: Auto Version and Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/**'

permissions:
  contents: write
  actions: read

jobs:
  version-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Install dependencies
      run: npm install

    - name: Determine version bump type
      id: version_type
      run: |
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        if [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]] || [[ $COMMIT_MSG == *"major:"* ]]; then
          echo "bump=major" >> $GITHUB_OUTPUT
        elif [[ $COMMIT_MSG == *"feat:"* ]] || [[ $COMMIT_MSG == *"feature:"* ]]; then
          echo "bump=minor" >> $GITHUB_OUTPUT
        else
          echo "bump=patch" >> $GITHUB_OUTPUT
        fi

    - name: Bump version
      id: version
      run: |
        NEW_VERSION=$(npm version ${{ steps.version_type.outputs.bump }} --no-git-tag-version)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${NEW_VERSION#v}" >> $GITHUB_OUTPUT

    - name: Update package.json
      run: |
        git add package.json
        git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"

    - name: Create and push tag
      run: |
        git tag ${{ steps.version.outputs.new_version }}
        git push origin main --tags

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.new_version }}
        release_name: Environmental Sensor Dashboard ${{ steps.version.outputs.new_version }}
        body: |
          ## 🚀 Auto-release ${{ steps.version.outputs.new_version }}
          
          This release was automatically created from the latest changes in the main branch.
          
          ### What's Changed
          - Latest updates and improvements
          - Builds for Windows, macOS Intel, and macOS ARM64
          
          ### Downloads
          The desktop applications for all platforms are being built automatically and will be available shortly.
          
          **Commit:** ${{ github.event.head_commit.message }}
          **SHA:** ${{ github.sha }}
        draft: false
        prerelease: false
