name: Build and Release Desktop Apps

on:
  push:
    branches: [ main, develop, feature/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flask pyserial

    - name: Install Node dependencies
      run: npm install

    - name: Build Python backend
      run: |
        python -m PyInstaller --onefile --name serial_backend --distpath dist --workpath build --specpath build --console serial_backend.py

    - name: Build Next.js app
      run: |
        npm run build
        node fix-assets.js

    - name: Build Electron app for Windows
      if: matrix.platform == 'windows'
      run: npx electron-builder --win --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Electron app for macOS Intel
      if: matrix.platform == 'mac' && matrix.arch == 'x64'
      run: npx electron-builder --mac --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Electron app for macOS ARM64
      if: matrix.platform == 'mac' && matrix.arch == 'arm64'
      run: npx electron-builder --mac --arm64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Windows artifacts
      if: matrix.platform == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: windows-builds
        path: |
          dist/*.exe
          dist/*.exe.blockmap

    - name: Upload macOS Intel artifacts
      if: matrix.platform == 'mac' && matrix.arch == 'x64'
      uses: actions/upload-artifact@v4
      with:
        name: macos-intel-builds
        path: |
          dist/*.dmg
          dist/*.dmg.blockmap
          dist/latest-mac.yml

    - name: Upload macOS ARM64 artifacts
      if: matrix.platform == 'mac' && matrix.arch == 'arm64'
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-builds
        path: |
          dist/*-arm64.dmg
          dist/*-arm64.dmg.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -la artifacts/

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Environmental Sensor Dashboard ${{ github.ref_name }}
        body: |
          ## 📊 Environmental Sensor Dashboard ${{ github.ref_name }}
          
          ### Downloads
          
          **Windows:**
          - Setup Installer (Recommended)
          - Portable Version
          
          **macOS:**
          - Intel Macs (x64)
          - Apple Silicon (ARM64)
          
          ### Features
          - Real-time sensor data monitoring
          - Interactive charts and visualizations
          - Serial port communication
          - Cross-platform desktop application
          - No Python installation required (bundled backend)
          
          ### Installation
          1. Download the appropriate version for your system
          2. Run the installer or open the DMG file
          3. Launch the application
          4. Connect your sensor and start monitoring!
          
          Built automatically from commit ${{ github.sha }}
        draft: false
        prerelease: false

    - name: Upload Windows Setup
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/windows-builds/Environmental Sensor Dashboard Setup ${{ github.ref_name }}.exe
        asset_name: Environmental-Sensor-Dashboard-Setup-${{ github.ref_name }}-Windows.exe
        asset_content_type: application/octet-stream

    - name: Upload Windows Portable
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/windows-builds/Environmental Sensor Dashboard ${{ github.ref_name }}.exe
        asset_name: Environmental-Sensor-Dashboard-Portable-${{ github.ref_name }}-Windows.exe
        asset_content_type: application/octet-stream

    - name: Upload macOS Intel DMG
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/macos-intel-builds/Environmental Sensor Dashboard-${{ github.ref_name }}.dmg
        asset_name: Environmental-Sensor-Dashboard-${{ github.ref_name }}-macOS-Intel.dmg
        asset_content_type: application/octet-stream

    - name: Upload macOS ARM64 DMG
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/macos-arm64-builds/Environmental Sensor Dashboard-${{ github.ref_name }}-arm64.dmg
        asset_name: Environmental-Sensor-Dashboard-${{ github.ref_name }}-macOS-ARM64.dmg
        asset_content_type: application/octet-stream
